spring.application.name=shopedex

server.address=0.0.0.0
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

spring.web.locale=es-ES
spring.web.locale-resolver=fixed

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/shopedex}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shopedex}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shopedex}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

security.jwt.signing-key-secret=${SECURITY_JWT_SIGNING_KEY_SECRET:change_this_for_local_dev_only_please_use_env_vars}
security.jwt.access-token-ttl=${SECURITY_JWT_ACCESS_TOKEN_TTL:900000}
security.jwt.refresh-token-ttl=${SECURITY_JWT_REFRESH_TOKEN_TTL:604800000}
