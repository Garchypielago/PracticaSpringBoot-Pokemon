<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear una nueva categoria</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>

<div class="container">
    <h1>Crear una nueva categoria</h1>

    <div th:if="${message}" th:text="${message}"
         class="alert alert-success" role="alert"></div>

    <form method="post" th:object="${category}">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
            <h3>Global Errors:</h3>
            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="select-type">Category</label>
            <select class="form-select form-control" id="select-type" th:field="*{categoryType}">
                <option value="" selected>Select One</option>
                <option value="1">Region</option>
                <option value="2">Type</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label" for="txt-name">Category name</label>
            <input class="form-control" type="text" id="txt-name" placeholder="Here the name" th:field="*{name}" th:errorclass="is-invalid">
            <div th:if="${#fields.hasErrors('name')}" class="invalid-feedback" th:text="${#fields.errors('name')}">
                Error.
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="txt-background">Background (if you have one)</label>
            <input class="form-control" type="text" id="txt-background" placeholder="Background path"
                   th:field="*{background}">

        </div>
        <div class="mb-3">
            <button class="btn btn-primary" type="submit" id="btn-new-category">Send request</button>
            <a class="btn btn-primary" th:href="@{'/admin/home'}" style="text-decoration: none;">Go to admin home</a>
        </div>
    </form>
</div>
<script th:src="@{/js/admin-category.js}"></script>
<script th:src="@{/js/bootstrap.min.js}"></script>
</body>
</html>
