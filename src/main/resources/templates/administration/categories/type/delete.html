<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="'Delete '+ ${category.getName()}">Delete</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

</head>
<div class="alert alert-warning" role="alert">
    <h4 class="alert-heading" th:text="'Delete '+ ${category.getName()}">Delete type</h4>
    <p>Are you sure you want to delete this type?</p>
    <hr>
    <table class="table">
        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Name</th>
        </tr>
        </thead>
        <tbody class="table-group-divider">
        <tr>
            <td th:text="${category.getId()}"></td>
            <td th:text="${category.getName()}"></td>
        </tr>
        </tbody>
    </table>
    <form th:action="@{'/admin/categories/type/delete/' + ${category.id}}" method="post">

        <div class="d-grid gap-2 col-6 mx-auto">
            <button type="submit" class="btn btn-outline-danger d-block "
                    th:text="'Yes, delete '+ ${category.getName()}">Yes, delete
            </button>
            <a class="btn btn-outline-success d-block " th:href="@{'/admin/categories/type/list'}"
               style="text-decoration: none;">No, return to the list</a>
        </div>

    </form>
</div>
<body>

</body>

<script th:src="@{/js/bootstrap.min.js}"></script>

</html>
